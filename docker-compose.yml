# Local infrastructure for RUVO.
#   docker compose up -d                   -> postgres and searxng
#   docker compose --profile fetch up -d   -> also the fetch service, for a machine without Python and Scrapling
#   docker compose --profile laya up -d    -> also the optional self-hosted Laya decider
# Ports set in apps/server/.env (POSTGRES_PORT, SCRAPLING_PORT) apply when `bun run setup` starts these,
# or by hand with `docker compose --env-file apps/server/.env up -d`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ruvo
      POSTGRES_PASSWORD: ruvo
      POSTGRES_DB: ruvo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruvo -d ruvo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web search for finding sources (SEARXNG_URL): http://127.0.0.1:8888/search?q=...&format=json
  searxng:
    image: searxng/searxng:2026.10.2-19ffbcd30
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    # Without SEARXNG_SECRET, a random secret for each start: nothing this instance keeps needs the same one.
    entrypoint: ["/bin/sh", "-c", "export SEARXNG_SECRET=\"$${SEARXNG_SECRET:-$$(head -c 32 /dev/urandom | base64)}\" && exec /usr/local/searxng/entrypoint.sh"]
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The fetch service (SCRAPLING_URL), which `bun run dev` uses when it answers. As in docker-compose.prod.yml, its
  # only network is internal, so the egress guard, which refuses private addresses, is its only way out.
  scrapling:
    profiles: ["fetch"]
    build: ./infra/scrapling
    restart: unless-stopped
    init: true
    environment:
      EGRESS_PROXY: socks5://egress:1080
    networks: [scrape]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  egress:
    profiles: ["fetch"]
    build:
      context: .
      dockerfile: infra/egress/Dockerfile
    restart: unless-stopped
    init: true
    networks: [default, scrape]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Docker publishes no port for a container whose only network is internal, so this one forwards 127.0.0.1:SCRAPLING_PORT to it.
  relay:
    profiles: ["fetch"]
    image: alpine/socat:1.8.1.1
    command: ["TCP-LISTEN:8001,fork,reuseaddr", "TCP:scrapling:8001"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SCRAPLING_PORT:-8001}:8001"
    networks: [default, scrape]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Fallback decision provider; the MVP uses the hosted Jev API instead.
  laya:
    profiles: ["laya"]
    build: ./infra/laya
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - laya-models:/models
    mem_limit: 4g

networks:
  scrape:
    internal: true

volumes:
  postgres-data:
  laya-models:
